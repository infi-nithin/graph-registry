[project]
name = "graph-registry"
version = "0.1.0"
description = "Dynamic Intent Graphs Management API with PostgreSQL persistence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "fastmcp>=3.1.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.41.0",
    # Database dependencies
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
]

[tool.setuptools.packages.find]
where = ["src"]
